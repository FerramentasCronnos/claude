<script>
  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const lerp = (a, b, f) => a + (b - a) * f;
  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeInCubic = x => x * x * x;
  const easeOutQuad = x => 1 - (1 - x) * (1 - x);
  const easeInOutQuad = x => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const mix = (a, b, f) => {
    const A = hex(a), B = hex(b);
    return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], f))).join(',')})`;
  };

  // ---------- linha do tempo (ciclo de 5 s, 2 ciclos = 10 s, loop perfeito) ----------
  const CYCLE = 5;
  const CLICKS = [1.55, 2.55, 3.55];                 // instantes do "clique" dentro do ciclo
  const REST = { x: 1679, y: 768, rot: 0 };          // dedo em repouso (ponta do dedo)
  const PRESS = { x: 1572, y: 790, rot: -28.5 };     // dedo tocando o canto do botão
  const ORANGE = '#E2672B', ORANGE_DARK = '#C05622';

  const el = id => document.getElementById(id);
  const title = el('title'), clock = el('clock'), hour = el('hour'), minute = el('minute');
  const button = el('button'), hand = el('hand'), spark = el('spark');

  function seek(t) {
    const u = t - CYCLE * Math.floor(t / CYCLE + 1e-9);

    // Texto de cima: sempre visível (o vídeo já começa com ele).
    title.style.opacity = 1;

    // Relógio: entra suave (fade + escala), some rapidamente no fim do ciclo e volta no próximo.
    const cin = easeOutCubic(ramp(u, 0.10, 0.55));
    const cout = easeInCubic(ramp(u, 4.55, 4.75));
    clock.style.opacity = (cin * (1 - cout)).toFixed(4);
    clock.style.transform = `scale(${(lerp(0.86, 1, cin) * lerp(1, 0.94, cout)).toFixed(4)})`;
    // Ponteiros girando continuamente (minutos: 1 volta a cada 2,4 s).
    minute.setAttribute('transform', `rotate(${((50 + u * 150) % 360).toFixed(3)})`);
    hour.setAttribute('transform', `rotate(${((305 + u * 12.5) % 360).toFixed(3)})`);

    // Botão "HAZ CLIC PARA ESCUCHAR": entra depois do relógio, some junto no fim do ciclo.
    const bin = easeOutCubic(ramp(u, 0.65, 1.05));
    const bout = easeInCubic(ramp(u, 4.65, 4.85));

    // Feedback do clique (botão afunda e escurece) + faísca.
    let press = 0, sparkP = -1, pose = 0;
    for (const P of CLICKS) {
      const down = ramp(u, P - 0.03, P + 0.02);
      const up = easeOutQuad(ramp(u, P + 0.12, P + 0.40));
      press = Math.max(press, down * (1 - up));
      if (u >= P - 1e-6 && u < P + 0.38) sparkP = Math.max(0, u - P) / 0.38;
      const approach = easeInOutQuad(ramp(u, P - 0.30, P));
      const back = easeInOutQuad(ramp(u, P + 0.12, P + 0.45));
      pose = Math.max(pose, approach * (1 - back));
    }
    button.style.opacity = (bin * (1 - bout)).toFixed(4);
    button.style.transform = `scale(${(lerp(0.9, 1, bin) * lerp(1, 0.965, press) * lerp(1, 0.96, bout)).toFixed(4)})`;
    button.style.background = mix(ORANGE, ORANGE_DARK, press);

    // Dedo: entra com o botão, vai até o botão, clica e volta.
    const hin = easeOutCubic(ramp(u, 0.75, 1.15));
    const hx = lerp(REST.x, PRESS.x, pose) + lerp(40, 0, hin);
    const hy = lerp(REST.y, PRESS.y, pose) + lerp(50, 0, hin);
    const hrot = lerp(REST.rot, PRESS.rot, pose);
    hand.style.opacity = (hin * (1 - bout)).toFixed(4);
    hand.style.transform = `translate(${(hx - 60).toFixed(2)}px, ${(hy - 20).toFixed(2)}px) rotate(${hrot.toFixed(2)}deg)`;

    // Faísca azul na ponta do dedo no instante do clique.
    if (sparkP >= 0) {
      spark.style.opacity = (1 - easeInCubic(sparkP)).toFixed(4);
      spark.style.transform = `translate(${PRESS.x - 80}px, ${PRESS.y - 80}px) scale(${lerp(0.7, 1.15, easeOutCubic(sparkP)).toFixed(4)})`;
    } else {
      spark.style.opacity = 0;
    }
  }
  window.seek = seek;
  seek(0);

  // Pré-visualização no navegador (não usada na renderização): toca em loop.
  if (!navigator.webdriver) {
    const t0 = performance.now();
    (function loop() { seek(((performance.now() - t0) / 1000) % 10); requestAnimationFrame(loop); })();
  }
</script>
